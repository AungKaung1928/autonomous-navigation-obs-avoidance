patrol_controller:
  ros__parameters:
    use_sim_time: true
    patrol_speed: 0.2        # forward speed when the front sector is clear (m/s)
    turn_speed: 0.5          # in-place rotation speed while choosing a lane (rad/s)
    safe_distance: 0.8       # front / side sector minimum range that counts as clear (m)
    min_lane_width: 0.8      # side lane must be at least this wide to be entered (m)
